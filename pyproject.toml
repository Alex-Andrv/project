[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llmq-triton"
version = "0.1.0"
description = "Triton int4 weight quantization and W4A16 inference benchmarks for LLM linear layers."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "triton>=3.0.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "accelerate>=0.27.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["llmq*"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["llmq", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
